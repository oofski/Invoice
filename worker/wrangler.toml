name = "invoice"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# --- D1 database binding (Brief data store, now on Cloudflare D1) ---
# Create the DB once with:  wrangler d1 create invoiceiq
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "invoiceiq"
database_id = "3091c97d-d3f3-4deb-a5c5-f7521dbe1a3d"

# --- R2 bucket binding (invoice PDF storage) ---
# Create the bucket once with:  wrangler r2 bucket create invoiceiq-pdfs
[[r2_buckets]]
binding = "PDFS"
bucket_name = "invoiceiq-pdfs"

# --- Static Assets: the Executive Mobile Receipt SPA (mobile/dist), same origin ---
# The worker serves the built mobile SPA for all non-API paths; the mobile build is
# wired into `predeploy` (package.json) so `mobile/dist` exists before deploy.
#
# NOTE: the installed wrangler (3.114.17) does NOT support the `run_worker_first`
# ARRAY form — it errors "Expected assets.run_worker_first to be of type boolean".
# So we bind ASSETS (no run_worker_first) and route API-vs-SPA with a trailing
# catch-all in src/index.ts, registered AFTER every /api/* and /ingest/* route.
# With `main` set, any request that does NOT match a static asset invokes the
# worker, so /api/* & /ingest/* always run the unchanged Hono handlers; only
# non-API paths fall through to the SPA. `not_found_handling` makes ASSETS.fetch
# return index.html for unmatched client routes (SPA deep-link/refresh).
[assets]
directory = "../mobile/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# --- Secrets (dashboard: Settings -> Variables and Secrets; or `wrangler secret put`) ---
# REDUCTO_API_KEY           (REQUIRED — Reducto parse + /extract; reducto.ai)
# INGEST_TOKEN              (optional — shared secret for SharePoint/Power Automate ingestion)
# RESEND_API_KEY            (optional — approval/reminder emails)
# SESSION_SECRET            (optional extra entropy for tokens)
# ANTHROPIC_API_KEY         (no longer used — routing + GL coding are rules + Reducto extract)

[vars]
RESEND_FROM_EMAIL = "invoices@example.com"
# Override only if Reducto gives you a different API base for your account:
# REDUCTO_BASE_URL = "https://platform.reducto.ai"
# APP_URL is informational (used in emails); the desktop app is the primary client.
APP_URL = "https://invoiceiq.example.com"
