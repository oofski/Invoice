# Builds the InvoiceIQ Windows desktop installer and publishes it to a GitHub
# Release. electron-builder's NSIS target requires Windows, so this runs on a
# windows-latest runner.
name: Release Desktop

on:
  # Build + publish whenever a version tag is pushed (e.g. v1.0.0), OR whenever
  # the app version changes on the dev branch (a push that edits
  # desktop/package.json) — so bumping the version cuts a release with no clicks.
  push:
    tags:
      - "v*"
    branches:
      - "claude/zen-goldberg-wgv2c4"
    paths:
      - "desktop/package.json"
  # Allow manual runs from the Actions tab as well.
  workflow_dispatch:

# electron-builder needs write access to create/update the GitHub Release and
# upload the installer + auto-update metadata (latest.yml, .blockmap).
permissions:
  contents: write

# Serialize release runs on the same ref so two builds can never race on the
# same version — which could split assets across two draft releases or strand a
# draft. Queue (don't cancel) so an in-flight publish always finishes.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install the Electron / electron-builder dev dependencies for the
      # desktop wrapper.
      - name: Install desktop dependencies
        run: npm --prefix desktop install

      # Install renderer dependencies. The renderer lives in desktop/renderer
      # and is built before packaging. Resilient to a missing/empty renderer:
      # if there is no package.json yet, this step is a no-op.
      - name: Install renderer dependencies
        shell: bash
        run: |
          if [ -f desktop/renderer/package.json ]; then
            npm --prefix desktop/renderer install
          else
            echo "No desktop/renderer/package.json found; skipping renderer install."
          fi

      # Guard: the entity Chart-of-Accounts maps are duplicated in the worker
      # and the renderer (no shared package). They MUST stay identical or the UI
      # would show one account number while the export emits another. Fail the
      # release before building if they drift.
      - name: Check COA sync (worker ↔ renderer)
        shell: bash
        run: node scripts/check-coa-sync.mjs

      # Build the renderer with the backend URL baked in. VITE_API_BASE_URL is
      # taken from a repository variable/secret of the same name and defaults to
      # empty if unset. Resilient to a renderer that has no build script.
      - name: Build renderer
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || '' }}
        run: |
          if [ -f desktop/renderer/package.json ]; then
            npm --prefix desktop/renderer run build
          else
            echo "No desktop/renderer/package.json found; skipping renderer build."
          fi

      # Build + publish via electron-builder. `--publish always` uploads the
      # .exe AND the auto-update metadata (latest.yml + .blockmap) to a GitHub
      # Release named after the version in desktop/package.json (e.g. v1.0.1),
      # creating the tag if needed. The publish config uses releaseType "draft",
      # so the release stays a DRAFT (hidden from the public "latest release"
      # feed) while assets upload — this closes the auto-update race where
      # electron-builder would flip the release to published the instant the
      # .exe landed but BEFORE latest.yml finished uploading, so an app checking
      # for updates in that window 404'd on latest.yml. The final publish-release
      # job below flips the draft to published only once every asset is present.
      # Triggered by a version tag push OR a manual "Run workflow". Download link:
      #   https://github.com/<owner>/<repo>/releases/tag/v<version>
      - name: Build + publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || '' }}
        run: npm --prefix desktop run release

      # Always make the installer available as a workflow artifact too.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoiceiq-windows-installer
          path: desktop/release/*.exe
          if-no-files-found: error

  # macOS DMG. electron-builder's dmg target requires a macOS runner. Runs AFTER
  # the Windows job so the GitHub Release already exists (the mac job just adds
  # the .dmg asset, avoiding a create-release race). The build is UNSIGNED
  # (identity: null) — macOS Gatekeeper will warn ("unidentified developer");
  # users open it via right-click → Open the first time.
  build-macos:
    needs: build-windows
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop dependencies
        run: npm --prefix desktop install

      - name: Install renderer dependencies
        shell: bash
        run: |
          if [ -f desktop/renderer/package.json ]; then
            npm --prefix desktop/renderer install
          else
            echo "No desktop/renderer/package.json found; skipping renderer install."
          fi

      - name: Build renderer
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || '' }}
        run: |
          if [ -f desktop/renderer/package.json ]; then
            npm --prefix desktop/renderer run build
          else
            echo "No desktop/renderer/package.json found; skipping renderer build."
          fi

      # Build + publish the .dmg to the same GitHub Release (created by the
      # Windows job). CSC_IDENTITY_AUTO_DISCOVERY=false keeps electron-builder
      # from attempting to code-sign without a certificate.
      - name: Build + publish DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm --prefix desktop run release:mac

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoiceiq-macos-dmg
          path: desktop/release/*.dmg
          if-no-files-found: error

  # Flip the draft release to PUBLISHED — only after BOTH platform jobs have
  # finished uploading, so the release becomes visible to the auto-updater with
  # every asset (latest.yml, .exe, .dmg, latest-mac.yml) already present. This is
  # what fixes the "Cannot find latest.yml … 404" race: until this step runs the
  # release is a draft and the updater never sees a half-uploaded release.
  #
  # `if: always() && needs.build-windows.result == 'success'` publishes as long
  # as the Windows build succeeded, even if the (unsigned, secondary) macOS build
  # failed — so a flaky mac job never strands a good Windows release as a hidden
  # draft. If Windows failed there is nothing worth publishing and the draft is
  # left for inspection.
  publish-release:
    needs: [build-windows, build-macos]
    if: ${{ always() && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v${VERSION}"
          echo "Publishing draft release ${TAG}…"
          # The draft may still report its assets as uploading for a beat; give it
          # a moment so latest.yml is durably attached before the release goes live.
          sleep 10
          # Retry so a transient gh/API blip can't strand a good build as a
          # permanent draft (the whole point of this job). 5 attempts, backing off.
          for attempt in 1 2 3 4 5; do
            if gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest; then
              echo "Published ${TAG}."
              exit 0
            fi
            echo "Publish attempt ${attempt} failed; retrying in $((attempt * 5))s…"
            sleep $((attempt * 5))
          done
          echo "::error::Failed to publish draft release ${TAG} after 5 attempts."
          exit 1
